<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];

  gtag('config', 'G-3ENCBC9RT3');

  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>7Tribes — Referrals Leaderboard</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    :root{--bg:#0b0b0c;--card:#121214;--text:#eaeaea;--muted:#a1a1a6;--border:#222;--accent:#FFD700}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif}
    .wrap{max-width:min(980px, calc(100vw - 32px));margin:auto;padding:20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .pill{display:inline-block;background:#1b1b1f;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:999px;font-size:12px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
    input{background:#0f0f13;color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}
    th{color:var(--muted)}
    a{color:var(--accent);text-decoration:none}
    .bar{height:8px;background:#1a1a1d;border-radius:999px;overflow:hidden}
    .bar>i{display:block;height:100%;background:var(--accent);width:0%}
  
    /* === GLOBAL RESPONSIVE FIXES === */
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: clip; }
    body { 
      max-width: 100vw; 
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }
    img, video, iframe, embed, object { max-width: 100%; height: auto; }
    pre, code, .address, .hash, .contract-address { 
      word-break: break-all; 
      overflow-wrap: break-word; 
    }
    table { max-width: 100%; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    input, select, textarea, button { max-width: 100%; }

  
    /* === MOBILE RESPONSIVE (max-width: 480px) === */
    @media (max-width: 480px) {
      body { font-size: 16px; }
      h1 { font-size: clamp(28px, 7vw, 44px); }
      h2 { font-size: clamp(22px, 5.5vw, 34px); }
      h3 { font-size: clamp(18px, 4.5vw, 26px); }
      .wrap, .container, [class*="wrap"], main { 
        padding-left: 16px; 
        padding-right: 16px; 
        max-width: 100%;
      }
      .btn, button, [class*="btn"] { 
        min-height: 44px; 
        padding: 12px 16px;
        font-size: 14px;
      }
      table { font-size: 13px; }
      td, th { padding: 8px 6px; }
    }

    /* === TABLET RESPONSIVE (max-width: 768px) === */
    @media (max-width: 768px) {
      .wrap, .container, [class*="wrap"] { 
        padding-left: 20px; 
        padding-right: 20px;
        max-width: 100%;
      }
    }

  
    /* === SECONDARY PAGE MOBILE FIXES === */
    @media (max-width: 430px) {
      body > *, main, .container, .wrap, [class*="wrap"], [class*="container"] {
        max-width: 100vw !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
      h1 { font-size: clamp(24px, 7vw, 38px) !important; }
      h2 { font-size: clamp(20px, 5.5vw, 30px) !important; }
      h3 { font-size: clamp(17px, 4.5vw, 24px) !important; }
      .hero, .hero-section, .banner, [class*="hero"], [class*="banner"] {
        min-height: auto !important;
        padding: 40px 16px !important;
      }
      [class*="grid"], [class*="cards"], [class*="columns"] {
        grid-template-columns: 1fr !important;
        display: grid !important;
      }
      .card, [class*="card"] {
        padding: 14px !important;
        margin-bottom: 12px;
      }
      .btn, button, [class*="btn"], input[type="submit"] {
        min-height: 44px;
        padding: 12px 16px !important;
        font-size: 14px !important;
        display: block;
        width: 100%;
        text-align: center;
      }
      input, select, textarea {
        width: 100% !important;
        max-width: 100% !important;
        font-size: 16px !important;
        padding: 12px !important;
      }
      table { font-size: 12px !important; }
      td, th { padding: 6px 4px !important; }
      footer, [class*="footer"] {
        text-align: center;
        padding: 20px 16px !important;
      }
      footer > *, footer .wrap {
        flex-direction: column !important;
        gap: 10px;
      }
      pre, code {
        font-size: 11px !important;
        white-space: pre-wrap;
        word-break: break-all;
        padding: 10px !important;
      }
      iframe {
        width: 100% !important;
        height: auto !important;
        min-height: 200px;
      }
    }

    @media (max-width: 768px) {
      [class*="grid"], [class*="cards"] {
        grid-template-columns: 1fr !important;
      }
      .sidebar, [class*="sidebar"] {
        display: none;
      }
    }

  
    /* === HAMBURGER MENU (992px) === */
    .menu-toggle{
      display:none;
      background:none;
      border:none;
      color:var(--gold-bright, #e7b852);
      font-size:26px;
      cursor:pointer;
      padding:8px;
      line-height:1;
      min-width:44px;
      min-height:44px;
      align-items:center;
      justify-content:center;
    }
    .menu-overlay{
      display:none;
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.7);
      z-index:998;
    }
    .menu-overlay.active{display:block}
    .mobile-drawer{
      display:none;
      position:fixed;
      top:0;right:0;
      width:min(300px, 85vw);
      height:100vh;height:100dvh;
      background:linear-gradient(135deg, rgba(15,10,5,.98), rgba(26,18,8,.98));
      border-left:1px solid rgba(255,215,122,.2);
      z-index:999;
      overflow-y:auto;
      flex-direction:column;
      transform:translateX(100%);
      transition:transform .3s cubic-bezier(.23,1,.32,1);
    }
    .mobile-drawer.active{
      display:flex;
      transform:translateX(0);
    }
    .drawer-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 18px;
      border-bottom:1px solid rgba(255,215,122,.15);
    }
    .drawer-header img{width:28px;height:28px;border-radius:50%}
    .drawer-header span{color:#e7b852;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
    .close-btn{
      background:none;border:none;
      color:#e7b852;font-size:28px;
      cursor:pointer;padding:4px 8px;
      min-width:44px;min-height:44px;
      display:flex;align-items:center;justify-content:center;
    }
    .drawer-links{padding:16px 18px;display:flex;flex-direction:column;gap:0}
    .drawer-links a{
      display:block;
      padding:14px 0;
      color:#f5e6c8;
      font-size:15px;
      font-weight:600;
      border-bottom:1px solid rgba(255,215,122,.08);
      text-decoration:none;
    }
    .drawer-links a:hover{color:#e7b852}
    body.menu-open{overflow:hidden}

    @media (max-width:992px){
      .main-nav, .nav-links{display:none !important}
      .menu-toggle{display:flex !important}
    }

  
    /* === HERO & SPACING FIXES === */
    .site-header, header {
      margin-top: 0;
    }
    .hero-banner, .hero, [class*="hero"] {
      position: relative;
    }
    .hero-banner::before, .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.45) 40%, rgba(0,0,0,.7) 100%);
      z-index: 1;
    }
    .hero-banner > *, .hero > *, .banner-text, .hero-content {
      position: relative;
      z-index: 2;
    }

    @media (max-width:992px) {
      /* Header spacing */
      .top-nav, nav.top-nav, header > nav, .site-header > nav {
        padding: 0;
      }
      .top-nav-inner, .header-inner, nav > div {
        padding: 8px 16px !important;
        flex-wrap: nowrap !important;
      }
      .nav-brand img, .brand img {
        width: 32px !important;
        height: 32px !important;
      }
      .nav-brand span, .brand b {
        font-size: 13px !important;
      }

      /* Hero responsive */
      .hero-banner, .hero, [class*="hero-section"] {
        min-height: 240px !important;
        height: auto !important;
        padding: 60px 16px 40px !important;
      }
      .hero-banner h1, .hero-headline, .banner-text h1 {
        font-size: clamp(26px, 7vw, 40px) !important;
        line-height: 1.15 !important;
      }
      .hero-banner p, .hero-subheadline, .banner-text p {
        font-size: clamp(14px, 3.5vw, 18px) !important;
        line-height: 1.5 !important;
      }

      /* Section spacing */
      section, .section, [class*="section"] {
        padding-top: 36px !important;
        padding-bottom: 36px !important;
      }

      /* Full-width buttons */
      .btn, button:not(.menu-toggle):not(.close-btn), [class*="btn"]:not(.menu-toggle):not(.close-btn), a.btn, input[type="submit"] {
        display: block !important;
        width: calc(100% - 32px) !important;
        max-width: 400px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        min-height: 48px !important;
        padding: 14px 20px !important;
        font-size: 14px !important;
        text-align: center !important;
        box-sizing: border-box !important;
      }
      .hero-actions, .btn-group, [class*="actions"] {
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
        align-items: stretch !important;
        width: 100% !important;
      }
      .hero-actions .btn, .btn-group .btn {
        width: 100% !important;
        max-width: none !important;
      }
    }

    @media (max-width:430px) {
      .hero-banner, .hero {
        padding: 50px 12px 32px !important;
        min-height: 200px !important;
      }
      .hero-banner h1, .banner-text h1, .hero-headline {
        font-size: clamp(22px, 6.5vw, 32px) !important;
      }
      section, .section {
        padding-top: 28px !important;
        padding-bottom: 28px !important;
      }
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <h1 style="margin:0">Referrals Leaderboard</h1>
      <a href="index.html">← Back</a>
    </div>
    <p style="color:#a1a1a6">Counts by flyer/source tag (e.g., <code>?src=barbershop</code>). Update <code>data/referrals.json</code> to refresh.</p>

    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <div>
          <span class="pill" id="updated">Updated —</span>
          <span class="pill" id="total">Total —</span>
          <span class="pill" id="unique">Sources —</span>
        </div>
        <div class="controls">
          <input id="q" type="text" placeholder="Search tag… (barbershop, church, park)"/>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Source Tag</th><th style="width:110px">Signups</th><th>Last Seen</th><th>Progress</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
  (async function(){
    const rows = document.getElementById('rows');
    const q = document.getElementById('q');
    const updated = document.getElementById('updated');
    const total = document.getElementById('total');
    const unique = document.getElementById('unique');

    async function load(){
      try{
        const r = await fetch('data/referrals.json', { cache:'no-store' });
        if(!r.ok) throw new Error('No data/referrals.json yet');
        const data = await r.json(); // {updated_at, items:[{source,count,last_seen}]}

        const items = Array.isArray(data.items) ? data.items : [];
        const sum = items.reduce((s,x)=>s+(x.count||0),0);
        updated.textContent = 'Updated ' + (data.updated_at ? new Date(data.updated_at).toLocaleString() : '—');
        total.textContent = 'Total ' + sum;
        unique.textContent = 'Sources ' + items.length;

        function render(){
          const term = (q.value||'').toLowerCase();
          const max = Math.max(1, ...items.map(x=>x.count||0));
          rows.innerHTML = '';
          items
            .filter(x => x.source.toLowerCase().includes(term))
            .sort((a,b)=> (b.count||0)-(a.count||0))
            .forEach(x=>{
              const pct = Math.round(((x.count||0)/max)*100);
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td><code>${x.source}</code></td>
                <td><strong>${x.count||0}</strong></td>
                <td>${x.last_seen ? new Date(x.last_seen).toLocaleString() : ''}</td>
                <td><div class="bar"><i style="width:${pct}%"></i></div></td>
              `;
              rows.appendChild(tr);
            });
          if(!rows.children.length){
            rows.innerHTML = '<tr><td colspan="4">No matches.</td></tr>';
          }
        }
        q.addEventListener('input', render);
        render();
      }catch(e){
        rows.innerHTML = `<tr><td colspan="4">⚠️ ${e.message}</td></tr>`;
      }
    }
    load();
  })();
  </script>

  <script>
  // Mobile Menu
  (function(){
    var toggle=document.getElementById("menu-toggle");
    var close=document.getElementById("close-menu");
    var drawer=document.getElementById("mobile-drawer");
    var overlay=document.getElementById("menu-overlay");
    if(!toggle||!drawer)return;
    function open(){drawer.classList.add("active");overlay.classList.add("active");document.body.classList.add("menu-open")}
    function shut(){drawer.classList.remove("active");overlay.classList.remove("active");document.body.classList.remove("menu-open")}
    toggle.addEventListener("click",open);
    close.addEventListener("click",shut);
    overlay.addEventListener("click",shut);
    drawer.querySelectorAll("a").forEach(function(a){a.addEventListener("click",shut)});
  })();
  </script>

</body>
</html>
