<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password | 7Tribes</title><link rel="stylesheet" href="../css/account.css"></head><body class="account-page"><main class="account-shell"><header class="account-header"><a class="account-brand" href="../index.html"><img src="../images/7trb_symbol.png" alt="7TRIBES symbol"><span>7TRIBES ACCOUNT</span></a></header><div class="account-wide account-card"><span class="account-kicker">ACCOUNT RECOVERY</span><h1>Set a new password.</h1><p>Use the secure recovery link from your email, then choose a new password.</p><form data-account-reset><div class="account-field"><label for="password">NEW PASSWORD</label><input id="password" name="password" type="password" autocomplete="new-password" required></div><div class="account-field"><label for="confirm_password">CONFIRM NEW PASSWORD</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div><button class="account-button" type="submit">Save new password</button><p class="account-status" data-account-status aria-live="polite"></p></form></div></main><script type="module" src="../js/account-app.js"></script></body></html>
