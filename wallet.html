<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>7TRB Wallet</title>
  <link rel="icon" href="images/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.1/dist/ethers.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root{--bg:#0b0b0c;--card:#11141a;--line:#222;--ink:#eaeaea;--muted:#a1a1a6;--gold:#FFD700}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial}
    .wrap{max-width:min(920px, calc(100vw - 32px));margin:auto;padding:20px}
    header{border-bottom:1px solid var(--line);background:#0e0f12}
    h1{margin:0;font-size:24px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .btn{display:inline-flex;gap:.5rem;align-items:center;background:linear-gradient(90deg,var(--gold),#b8912f);color:#111;
         padding:10px 14px;border:none;border-radius:999px;font-weight:800;cursor:pointer}
    .ghost{background:transparent;border:1px solid #2b2f3b;color:var(--ink)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
    .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
    label{font-size:.9rem;color:var(--muted)} input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2a2e;background:#0d0f12;color:#fff}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .small{font-size:.92rem;color:var(--muted)}
    .value{font-size:22px;font-weight:800}
    @media (max-width:min(900px, calc(100vw - 32px))){.grid{grid-template-columns:1fr}}
    canvas{max-width:100%}
  
    /* === GLOBAL RESPONSIVE FIXES === */
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: clip; }
    body { 
      max-width: 100vw; 
      overflow-x: clip;
      -webkit-text-size-adjust: 100%;
    }
    img, video, iframe, embed, object { max-width: 100%; height: auto; }
    pre, code, .address, .hash, .contract-address { 
      word-break: break-all; 
      overflow-wrap: break-word; 
    }
    table { max-width: 100%; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    input, select, textarea, button { max-width: 100%; }

  
    /* === MOBILE RESPONSIVE (max-width: 480px) === */
    @media (max-width: 480px) {
      body { font-size: 16px; }
      h1 { font-size: clamp(28px, 7vw, 44px); }
      h2 { font-size: clamp(22px, 5.5vw, 34px); }
      h3 { font-size: clamp(18px, 4.5vw, 26px); }
      .wrap, .container, [class*="wrap"], main { 
        padding-left: 16px; 
        padding-right: 16px; 
        max-width: 100%;
      }
      .btn, button, [class*="btn"] { 
        min-height: 44px; 
        padding: 12px 16px;
        font-size: 14px;
      }
      table { font-size: 13px; }
      td, th { padding: 8px 6px; }
    }

    /* === TABLET RESPONSIVE (max-width: 768px) === */
    @media (max-width: 768px) {
      .wrap, .container, [class*="wrap"] { 
        padding-left: 20px; 
        padding-right: 20px;
        max-width: 100%;
      }
    }

  
    /* === SECONDARY PAGE MOBILE FIXES === */
    @media (max-width: 430px) {
      body > *, main, .container, .wrap, [class*="wrap"], [class*="container"] {
        max-width: 100vw !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
      }
      h1 { font-size: clamp(24px, 7vw, 38px) !important; }
      h2 { font-size: clamp(20px, 5.5vw, 30px) !important; }
      h3 { font-size: clamp(17px, 4.5vw, 24px) !important; }
      .hero, .hero-section, .banner, [class*="hero"], [class*="banner"] {
        min-height: auto !important;
        padding: 40px 16px !important;
      }
      [class*="grid"], [class*="cards"], [class*="columns"] {
        grid-template-columns: 1fr !important;
        display: grid !important;
      }
      .card, [class*="card"] {
        padding: 14px !important;
        margin-bottom: 12px;
      }
      .btn, button, [class*="btn"], input[type="submit"] {
        min-height: 44px;
        padding: 12px 16px !important;
        font-size: 14px !important;
        display: block;
        width: 100%;
        text-align: center;
      }
      input, select, textarea {
        width: 100% !important;
        max-width: 100% !important;
        font-size: 16px !important;
        padding: 12px !important;
      }
      table { font-size: 12px !important; }
      td, th { padding: 6px 4px !important; }
      footer, [class*="footer"] {
        text-align: center;
        padding: 20px 16px !important;
      }
      footer > *, footer .wrap {
        flex-direction: column !important;
        gap: 10px;
      }
      pre, code {
        font-size: 11px !important;
        white-space: pre-wrap;
        word-break: break-all;
        padding: 10px !important;
      }
      iframe {
        width: 100% !important;
        height: auto !important;
        min-height: 200px;
      }
    }

    @media (max-width: 768px) {
      [class*="grid"], [class*="cards"] {
        grid-template-columns: 1fr !important;
      }
      .sidebar, [class*="sidebar"] {
        display: none;
      }
    }

  </style>
</head>
<body>

<header>
  <div class="wrap row" style="justify-content:space-between;padding:14px 20px">
    <div class="row">
      <img src="images/logo.png" alt="7TRB" style="width:42px;height:42px;border-radius:50%">
      <h1>7TRB Wallet</h1>
    </div>
    <div class="row">
      <button id="connectBtn" class="btn">Connect Wallet</button>
      <a href="index.html" class="btn ghost">← Back</a>
    </div>
  </div>
</header>

<main class="wrap" style="padding-top:16px">

  <!-- Network & token helpers -->
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="small">Network</div>
        <div id="netLabel" class="value">—</div>
      </div>
      <div class="row">
        <button id="addAlke" class="btn ghost">Add Alkebuleum</button>
        <button id="switchAlke" class="btn ghost">Switch to Alkebuleum</button>
        <button id="watch7TRB" class="btn ghost">Add 7TRB to Wallet</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <!-- Balances -->
    <section class="card">
      <div class="small">Your Address</div>
      <div id="addr" class="mono">—</div>
      <div class="small" style="margin-top:8px">QR for receiving</div>
      <canvas id="qr" style="background:#0d0f12;border:1px solid #1f1f23;border-radius:10px"></canvas>
      <div class="row" style="margin-top:10px">
        <button id="copyAddr" class="btn ghost">Copy Address</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <div class="grid">
        <div>
          <div class="small">Gas Token</div>
          <div id="gasBal" class="value">—</div>
          <div class="small" id="gasSym">AKE/ETH</div>
        </div>
        <div>
          <div class="small">7TRB Balance</div>
          <div id="trbBal" class="value">—</div>
          <div class="small">token</div>
        </div>
      </div>
    </section>

    <!-- Send -->
    <section class="card">
      <h3 style="margin:0 0 10px">Send 7TRB</h3>
      <div style="display:grid;gap:10px">
        <div>
          <label>Recipient</label>
          <input id="to" placeholder="0x… address">
        </div>
        <div>
          <label>Amount (7TRB)</label>
          <input id="amt" placeholder="0.0" inputmode="decimal">
        </div>
        <button id="send" class="btn">Send</button>
        <div id="txMsg" class="small"></div>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <div class="small">Note: You need a little <b>AKE</b> (on Alkebuleum) or <b>ETH</b> (on Ethereum) for gas.</div>
    </section>
  </div>

  <!-- Explorer links -->
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="small">Quick Links</div>
      <div class="row">
        <a id="explorerAcct" class="btn ghost" target="_blank" rel="noopener">Open Address in Explorer</a>
        <a id="explorerToken" class="btn ghost" target="_blank" rel="noopener">Open 7TRB in Explorer</a>
      </div>
    </div>
  </div>

</main>

<script src="js/wallet.js"></script>
</body>
</html>
