<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuru Wallet Access | 7TRB</title>
  <link rel="icon" href="images/7trb_symbol.png">
  <link rel="stylesheet" href="css/global-responsive.css">
  <link rel="stylesheet" href="css/unity-platform.css">
  <style>
    /* Design reminder: a quiet public gateway surface; no direct wallet account management. */
    :root{--ink:#fff7e6;--muted:#d4c3a1;--gold:#ffdd7a;--line:rgba(255,215,122,.2)}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#24170a,#090604 65%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    main{width:min(100%,620px);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(19,13,7,.88);box-shadow:0 24px 70px rgba(0,0,0,.4);text-align:center}
    img{width:72px;height:72px;object-fit:contain;margin:0 auto 18px}
    h1{margin:0 0 12px;color:var(--gold);font-size:clamp(1.9rem,7vw,3rem);line-height:1.08}
    p{margin:0 auto 20px;max-width:52ch;color:var(--muted)}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-weight:800;text-decoration:none}
    .btn.primary{border-color:transparent;background:linear-gradient(90deg,#e7b852,#ffdd7a);color:#130b03}
  </style>
</head>
<body data-unity-env="technology">
  <main>
    <img src="images/7trb_symbol.png" alt="7TRB">
    <h1>Nuru powers wallet and identity access.</h1>
    <p>7trb.com remains public. When opened inside the Nuru dApp Browser, the Dashboard can show your Nuru identity and verified two-address 7TRB balances.</p>
    <div class="actions">
      <a class="btn primary" href="dashboard.html">Open Dashboard</a>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.alkebuleum.nuru" target="_blank" rel="noopener">Download Nuru</a>
      <a class="btn" href="index.html">Back to 7TRB.com</a>
    </div>
  </main>
  <script src="js/nav.js"></script>
</body>
</html>
